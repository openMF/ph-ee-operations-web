<div
  class="container m-b-20"
  fxLayout="row"
  fxLayoutAlign="end"
  fxLayoutGap="20px"
  matomoForm="users-header"
>
  <button
    mat-raised-button
    color="primary"
    [routerLink]="['create']"
    matomoClick="create-user-button"
    (click)="onCreateUserClick()"
  >
    <fa-icon icon="plus"></fa-icon>&nbsp;&nbsp; Create User
  </button>
</div>

<div class="container" matomoForm="users-main-container">
  <div fxLayout="row" fxLayoutGap="20px" matomoForm="users-filter-section">
    <mat-form-field fxFlex>
      <mat-label>Filter</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event.target.value)"
        matomoClick="users-filter-input"
        placeholder="Search users by name or email"
      />
    </mat-form-field>
  </div>

  <div class="mat-elevation-z8" matomoForm="users-table-container">
    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      matomoForm="users-data-table"
    >
      <ng-container matColumnDef="firstname">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          matomoClick="users-sort-firstname"
        >
          First Name
        </th>
        <td mat-cell *matCellDef="let user">{{ user.firstname }}</td>
      </ng-container>

      <ng-container matColumnDef="lastname">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          matomoClick="users-sort-lastname"
        >
          Last Name
        </th>
        <td mat-cell *matCellDef="let user">{{ user.lastname }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          matomoClick="users-sort-email"
        >
          Email
        </th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="enabled">
        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
          matomoClick="users-sort-status"
        >
          Status
        </th>
        <td mat-cell *matCellDef="let user">
          <i
            class="fa fa-stop"
            [style.color]="user.enabled ? 'green' : 'red'"
            uib-tooltip="user.enabled ? 'Active' : 'Disabled'"
            tooltip-placement="top"
          >
          </i>
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
        matomoForm="users-table-header"
      ></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        [routerLink]="[row.id]"
        class="select-row"
        matomoClick="users-row-click"
        (click)="onUserClick(row)"
      ></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[10, 25, 50, 100]"
      showFirstLastButtons
      matomoForm="users-paginator"
    ></mat-paginator>
  </div>
</div>
