---
# MegaLinter GitHub Action
#
# This workflow will run MegaLinter on every push and pull request
# to ensure code quality and consistency across the project.
#
# Documentation: https://megalinter.io/

name: MegaLinter

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Cancel running jobs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Apply linter fixes configuration
  # If you use APPLY_FIXES: all, ensure you have a workflow token with push permissions
  APPLY_FIXES: none
  # Uncomment to apply fixes
  # APPLY_FIXES: all

  # Uncomment to use a PAT for applying fixes
  # APPLY_FIXES_EVENT: pull_request
  # APPLY_FIXES_MODE: commit

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    # Give the default GITHUB_TOKEN write permission to commit and push, comment issues & post new PR
    # Remove the ones you do not need
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # If you use VALIDATE_ALL_CODEBASE = true, you can remove this line to improve performance

      # Setup Node.js (required for Angular project)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      # Install dependencies before running MegaLinter
      - name: Install dependencies
        run: npm ci

      # MegaLinter
      - name: MegaLinter
        id: ml
        # You can override MegaLinter flavor used to have faster performances
        # More info at https://megalinter.io/flavors/
        uses: oxsecurity/megalinter@v7
        env:
          # All available variables are described in documentation
          # https://megalinter.io/configuration/
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }} # Validates all source when push on main, else just the git diff with main. Override with true if you always want to lint all sources
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment to disable copy-paste and spell checks
          # DISABLE: COPYPASTE,SPELL

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        if: ${{ success() }} || ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log

      # Create comment or PR Review
      # Comment reporter will post a comment on the PR or commit
      # PR review will create a proper review with inline comments
      - name: Comment MegaLinter results
        if: ${{ steps.ml.outputs.has_updated_sources == 1 && (env.APPLY_FIXES_EVENT != 'none' || env.APPLY_FIXES_MODE != 'commit') && (github.event_name == 'pull_request' || github.event_name == 'push') && github.repository == github.event.repository.full_name }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs').promises;
            const path = './megalinter-reports/megalinter.log';
            try {
              const logContent = await fs.readFile(path, 'utf8');
              const reportUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';

              const body = `## 🔍 MegaLinter Report

              MegaLinter has completed the analysis of your code.

              📊 **View full report**: [MegaLinter Results](${reportUrl})

              ${logContent.includes('ERROR') ? '❌ **Issues found**: Please check the detailed report above.' : '✅ **No issues found**: Your code looks great!'}

              ---
              *This comment was automatically generated by MegaLinter*`;

              if (context.eventName === 'pull_request') {
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              }
            } catch (error) {
              console.log('Could not read MegaLinter log file:', error);
            }
