version: 2.1
executors:
  docker-executor:
    docker:
      - image: circleci/openjdk:17-buster-node-browsers-legacy

jobs:
  build_and_push_image_with_branch_tag: # Renamed job for clarity
    executor: docker-executor
    environment:
      JVM_OPTS: -Xmx512m
      TERM: dumb  
      GITHUB_TOKEN: ${GITHUB_TOKEN}  # Add the GitHub token as an environment variable

    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Build and Push Docker Image with Branch Tag
          command: |
            # Set the image tag to the branch name, sanitizing it for Docker compatibility
            # Replace '/' with '-' and convert to lowercase for common Docker tag conventions
            IMAGE_TAG=$(echo "$CIRCLE_BRANCH" | tr '/' '-' | tr '[:upper:]' '[:lower:]')

            # Check if the Docker image with the same tag already exists in Docker Hub
            # This is optional, remove if you always want to push
            if curl -s -f -u "$DOCKERHUB_USERNAME":"$DOCKERHUB_PASSWORD" "https://hub.docker.com/v2/repositories/openmf/ph-ee-operations-web/tags/$IMAGE_TAG" > /dev/null; then
              echo "Skipping the build and push as the tag $IMAGE_TAG already exists in Docker Hub."
              exit 0
            fi

            # Build and tag the Docker image
            docker build \
              --build-arg BUILDER_IMAGE=node:20-alpine \
              --build-arg NGINX_IMAGE=nginx:1.19.3 \
              --build-arg NPM_REGISTRY_URL=https://registry.npmjs.org/ \
              --build-arg PUPPETEER_DOWNLOAD_HOST_ARG=https://storage.googleapis.com \
              --build-arg PUPPETEER_CHROMIUM_REVISION_ARG=1011831 \
              -t "openmf/ph-ee-operations-web:$IMAGE_TAG" .

            # Push the Docker image to Docker Hub
            echo "${TOMS_TOKEN1}" | docker login -u "${DOCKERHUB_GAZELLE_USERNAME}" --password-stdin
            docker push "openmf/ph-ee-operations-web:$IMAGE_TAG"

  # The 'build_and_push_latest_image' job can be kept or removed based on your needs.
  # If you want to push 'latest' only on master, and branch tags for other branches,
  # then you would keep both jobs and adjust the workflows.
  build_and_push_latest_image:
    executor: docker-executor
    environment:
      JVM_OPTS: -Xmx512m
      TERM: dumb

    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24

      - run:
          name: Build Docker image
          command: |
            docker build \
              --build-arg BUILDER_IMAGE=node:20-alpine \
              --build-arg NGINX_IMAGE=nginx:1.19.3 \
              --build-arg NPM_REGISTRY_URL=https://registry.npmjs.org/ \
              --build-arg PUPPETEER_DOWNLOAD_HOST_ARG=https://storage.googleapis.com \
              --build-arg PUPPETEER_CHROMIUM_REVISION_ARG=1011831 \
              -t "openmf/ph-ee-operations-web:latest" .

            # If you still need the JIRA_STORY logic for non-master branches, you need to ensure
            # that JIRA_STORY is populated. The existing curl/jq logic for PR_TITLE
            # is dependent on CIRCLE_PULL_REQUEST which is not always available for non-PR branches.
            # For general branch-based tagging, the simple CIRCLE_BRANCH approach is more robust.
            if [ "$CIRCLE_BRANCH" != "master" ]; then
              # Consider using CIRCLE_BRANCH directly or a simplified naming convention
              # if JIRA_STORY extraction is complex or not always applicable.
              # For now, I'm commenting out the JIRA_STORY extraction for clarity as it's not
              # directly related to using CIRCLE_BRANCH for tagging, but rather a derived tag.
              # If you truly need a JIRA story, you might need a different mechanism to get it for non-PR branches.
              # PR_NUMBER=$(basename $CIRCLE_PULL_REQUEST)
              # PR_TITLE=$(curl -sSL "https://api.github.com/repos/openmf/$CIRCLE_PR_REPONAME/pulls/$PR_NUMBER" | jq -r '.title')
              # JIRA_STORY=$(echo $PR_TITLE | cut -d "[" -f2 | cut -d "]" -f1 | tr '[A-Z]' '[a-z]')
              # if [ -z "$JIRA_STORY" ]; then echo "Invalid PR title" && exit 1; else echo "Ticket NO: $JIRA_STORY"; fi
              # docker image tag openmf/$CIRCLE_PR_REPONAME:latest openmf/$CIRCLE_PR_REPONAME:$JIRA_STORY
              echo "INFO: Not tagging with JIRA story for non-master branch in this job. Consider using branch name directly if this is for all branches."
            fi

      - run:
          name: Login to DockerHub
          command: echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - run:
          name: Push Docker image to DockerHub
          command: |
            if [ "$CIRCLE_BRANCH" = "master" ]; then
              docker push openmf/ph-ee-operations-web:latest
            else
              # If you want to push a branch-specific tag *here* as well, you'd use CIRCLE_BRANCH
              # as done in the 'build_and_push_image_with_branch_tag' job.
              # For now, keeping the original logic for non-master in this job, though it relies on JIRA_STORY.
              # If JIRA_STORY is not reliably set, this part will fail or push with an empty tag.
              # docker push openmf/$CIRCLE_PR_REPONAME:${JIRA_STORY} # This still depends on JIRA_STORY
              echo "INFO: Only pushing 'latest' for master branch in this job. Branch-specific tags handled by 'build_and_push_image_with_branch_tag'."
            fi


workflows:
  version: 2
  build-and-push:
    jobs:
      # This job will now build and push an image tagged with the branch name for every branch
      - build_and_push_image_with_branch_tag:
          # Remove filters for tags here if you want it to run on all branch pushes,
          # not just those matching a tag pattern.
          # If you want this to run *only* for branches (not tags), you'd use a branch filter.
          # Example for running on all branches except master:
          filters:
            branches:
              ignore: master # Do not run this job on the master branch
            tags:
              ignore: /.*/ # Ignore all tags for this job
          context:
            - DOCKER
      
      # Keep this job if you still want to push a 'latest' tag specifically from the master branch.
      - build_and_push_latest_image:
          filters:
            branches:
              only: master # Only run this job on the master branch
          context:
            - DOCKER