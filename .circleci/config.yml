version: 2.1
orbs:
  docker-buildx: devarsh/docker-buildx-orb@0.1.1
executors:
  docker-executor:
    docker:
      - image: cimg/base:stable

jobs:
  build_and_push_image_with_branch_tag: # Renamed job for clarity
    executor: docker-executor
    environment:
      JVM_OPTS: -Xmx512m
      TERM: dumb  
      GITHUB_TOKEN: ${GITHUB_TOKEN}  # Add the GitHub token as an environment variable

    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Sanitize Branch Name
          command: |
            echo "export SANITIZED_BRANCH=$(echo $CIRCLE_BRANCH | sed 's/[^a-zA-Z0-9.-]/-/g' | tr '[:upper:]' '[:lower:]')" >> $BASH_ENV
      - run:
          name: Install Docker CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates gnupg lsb-release
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            sudo chmod a+r /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu focal stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update
            sudo apt-cache madison docker-ce-cli | grep 20.10
            sudo apt-get install -y docker-ce-cli=5:20.10.24~3-0~ubuntu-focal
      - docker-buildx/install
      - run:
          name: Check if Docker image tag exists
          command: |
            IMAGE_TAG=$SANITIZED_BRANCH
            IMAGE_NAME="openmf/ph-ee-operations-web"
            echo "Checking for Docker image: $IMAGE_NAME:$IMAGE_TAG"
            if curl -s -f -u "$DOCKERHUB_USERNAME":"$DOCKERHUB_PASSWORD" "https://hub.docker.com/v2/repositories/$IMAGE_NAME/tags/$IMAGE_TAG" > /dev/null; then
              echo "Skipping the build and push as the tag $IMAGE_TAG already exists in Docker Hub for image $IMAGE_NAME."
              circleci-agent step halt
            else
              echo "Tag $IMAGE_TAG does not exist for image $IMAGE_NAME. Proceeding with build."
            fi
      - run:
          name: Login to DockerHub
          command: echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
      - run:
          name: Build and Push Multi-Arch Image
          command: |
            docker buildx create --use --name multiarch-builder || docker buildx use multiarch-builder
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg BUILDER_IMAGE=node:20-alpine \
              --build-arg NGINX_IMAGE=nginx:1.19.3 \
              --build-arg NPM_REGISTRY_URL=https://registry.npmjs.org/ \
              --build-arg PUPPETEER_SKIP_DOWNLOAD_ARG=true \
              -t "openmf/ph-ee-operations-web:${SANITIZED_BRANCH}" \
              --push \
              .

  # The 'build_and_push_latest_image' job can be kept or removed based on your needs.
  # If you want to push 'latest' only on master, and branch tags for other branches,
  # then you would keep both jobs and adjust the workflows.
  build_and_push_latest_image:
    executor: docker-executor
    environment:
      JVM_OPTS: -Xmx512m
      TERM: dumb

    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Install Docker CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates gnupg lsb-release
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            sudo chmod a+r /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu focal stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update
            sudo apt-cache madison docker-ce-cli | grep 20.10
            sudo apt-get install -y docker-ce-cli=5:20.10.24~3-0~ubuntu-focal
      - docker-buildx/install
      - run:
          name: Login to DockerHub
          command: echo "${DOCKERHUB_PASSWORD}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
      - run:
          name: Build and Push Multi-Arch Image
          command: |
            docker buildx create --use --name multiarch-builder || docker buildx use multiarch-builder
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg BUILDER_IMAGE=node:20-alpine \
              --build-arg NGINX_IMAGE=nginx:1.19.3 \
              --build-arg NPM_REGISTRY_URL=https://registry.npmjs.org/ \
              --build-arg PUPPETEER_SKIP_DOWNLOAD_ARG=true \
              -t "openmf/ph-ee-operations-web:latest" \
              --push \
              .


workflows:
  version: 2
  build-and-push:
    jobs:
      # This job will now build and push an image tagged with the branch name for every branch
      - build_and_push_image_with_branch_tag:
          # Remove filters for tags here if you want it to run on all branch pushes,
          # not just those matching a tag pattern.
          # If you want this to run *only* for branches (not tags), you'd use a branch filter.
          # Example for running on all branches except master:
          filters:
            branches:
              ignore: master # Do not run this job on the master branch
            tags:
              ignore: /.*/ # Ignore all tags for this job
          context:
            - DOCKER
      
      # Keep this job if you still want to push a 'latest' tag specifically from the master branch.
      - build_and_push_latest_image:
          filters:
            branches:
              only: master # Only run this job on the master branch
          context:
            - DOCKER